<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5 px-6 py-5">
  <div class="grid gap-4 md:grid-cols-2">
    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-muted uppercase tracking-wide" for="specialty-code">Código</label>
      <input id="specialty-code" type="text" formControlName="code" placeholder="ej: dermatologia"
        [class]="inputClass(form.controls.code)" />
      @if (isInvalid(form.controls.code)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.code) }}</span>
      }
      @if (isEdit()) {
        <span class="text-xs text-muted">El código no se puede modificar.</span>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-xs font-medium text-muted uppercase tracking-wide" for="specialty-name">Nombre</label>
      <input id="specialty-name" type="text" formControlName="name" placeholder="ej: Dermatología"
        [class]="inputClass(form.controls.name)" />
      @if (isInvalid(form.controls.name)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.name) }}</span>
      }
    </div>
  </div>
</form>
