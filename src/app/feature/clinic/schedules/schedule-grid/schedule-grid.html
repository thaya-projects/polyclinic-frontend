<div class="flex flex-col gap-5">
  @for (day of weekdayLabels; track day; let dayIndex = $index) {
    <div class="rounded-xl border border-border bg-surface p-4">
      <div class="mb-3 flex items-center justify-between">
        <h4 class="text-sm font-semibold text-navy">{{ day }}</h4>
        <button type="button" (click)="addBlock(dayIndex)"
          class="inline-flex items-center gap-1 rounded-lg border border-border px-2 py-1 text-xs font-medium text-muted transition-colors hover:border-brand hover:text-brand">
          <i class="ti ti-plus"></i>
          Bloque
        </button>
      </div>

      @if (rowsByDay()[dayIndex].length === 0) {
        <span class="text-xs text-muted">Sin bloques configurados.</span>
      }

      @for (row of rowsByDay()[dayIndex]; track rowIndex(row)) {
        <div class="mb-2 flex flex-wrap items-start gap-2">
          <select [value]="row.branchId"
            (change)="updateRow(rowIndex(row), { branchId: $any($event.target).value })"
            [class]="rowClass(row, 'h-10 px-2')">
            <option value="" disabled>Sucursal</option>
            @for (b of availableBranches(); track b.id) {
              <option [value]="b.id">{{ b.name }}</option>
            }
          </select>

          <input type="time" [value]="row.startTime"
            (change)="updateRow(rowIndex(row), { startTime: $any($event.target).value })"
            [class]="rowClass(row, 'h-10 w-28 px-2')" />
          <span class="pt-2 text-xs text-muted">a</span>
          <input type="time" [value]="row.endTime"
            (change)="updateRow(rowIndex(row), { endTime: $any($event.target).value })"
            [class]="rowClass(row, 'h-10 w-28 px-2')" />

          <input type="number" min="1" step="5" [value]="row.slotMinutes"
            (change)="updateRow(rowIndex(row), { slotMinutes: +$any($event.target).value })"
            [class]="rowClass(row, 'h-10 w-20 px-2')"
            title="Minutos por turno" />
          <span class="pt-2 text-xs text-muted">min</span>

          <button type="button" (click)="removeAt(rowIndex(row))"
            class="h-10 rounded-lg border border-red-200 px-2 text-xs text-red-600 transition-colors hover:border-red-400">
            <i class="ti ti-trash"></i>
          </button>

          @if (row.error) {
            <span class="w-full text-xs text-red-500">{{ row.error }}</span>
          }
        </div>
      }
    </div>
  }

  <div class="flex items-center justify-end gap-2">
    <button type="button" (click)="submit()" [disabled]="saving() || hasError()"
      class="h-11 rounded-xl bg-brand px-5 text-sm font-medium text-white transition-colors hover:bg-brand-dark disabled:opacity-60">
      {{ saving() ? 'Guardando...' : 'Guardar horario' }}
    </button>
  </div>
</div>
