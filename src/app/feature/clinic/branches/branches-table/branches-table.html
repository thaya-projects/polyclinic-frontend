<app-data-table [columns]="columns" [rows]="rows()" emptyMessage="Sin sucursales todavía.">
  <ng-template appDataTableCell="name" let-row>
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-icon-soft text-brand">
        <i class="ti ti-building"></i>
      </div>
      <span class="font-semibold text-text">{{ row.name }}</span>
    </div>
  </ng-template>

  <ng-template appDataTableCell="address" let-row>
    <span class="text-sm text-muted">{{ row.address || '—' }}</span>
  </ng-template>

  <ng-template appDataTableCell="phone" let-row>
    <span class="text-sm text-muted">{{ row.phone || '—' }}</span>
  </ng-template>

  <ng-template appDataTableCell="timezone" let-row>
    <span class="font-mono text-xs text-muted">{{ row.timezone }}</span>
  </ng-template>

  <ng-template appDataTableCell="is_active" let-row>
    <app-status-chip [label]="row.is_active ? 'Activa' : 'Inactiva'"
      [tone]="row.is_active ? 'ok' : 'neutral'" />
  </ng-template>

  <ng-template appDataTableCell="actions" let-row>
    <div class="flex items-center justify-end gap-2">
      <button type="button" (click)="edit.emit(row)"
        class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-navy transition-colors hover:border-brand hover:text-brand">
        Editar
      </button>
      @if (row.is_active) {
        <button type="button" (click)="deactivate.emit(row)"
          class="rounded-lg border border-red-200 px-3 py-1.5 text-xs font-medium text-red-600 transition-colors hover:border-red-400">
          Desactivar
        </button>
      }
    </div>
  </ng-template>
</app-data-table>
