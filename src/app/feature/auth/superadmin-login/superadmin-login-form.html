<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <label class="flex flex-col gap-1.5">
    <span class="text-xs font-medium text-white/70">Correo</span>
    <input type="email" formControlName="email" placeholder="admin@medconnect.com" autocomplete="email"
      [class]="inputClass(form.controls.email)" />
    @if (isInvalid(form.controls.email)) {
      <span class="text-xs text-red-300">{{ errorMessage(form.controls.email) }}</span>
    }
  </label>

  <label class="flex flex-col gap-1.5">
    <span class="text-xs font-medium text-white/70">Contraseña</span>
    <div class="flex items-center gap-2">
      <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••"
        autocomplete="current-password" class="flex-1" [class]="inputClass(form.controls.password)" />
      <button type="button" (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/20 text-white/70 transition-colors hover:border-white/40 hover:text-white">
        <i class="ti" [class.ti-eye]="!showPassword()" [class.ti-eye-off]="showPassword()"></i>
      </button>
    </div>
    @if (isInvalid(form.controls.password)) {
      <span class="text-xs text-red-300">{{ errorMessage(form.controls.password) }}</span>
    }
  </label>

  <button type="submit" [disabled]="loading()"
    class="mt-2 flex h-12 items-center justify-center gap-2 rounded-xl bg-white text-sm font-semibold text-navy transition-colors hover:bg-white/90 disabled:cursor-not-allowed disabled:opacity-70">
    @if (loading()) {
      <i class="ti ti-loader-2 animate-spin"></i>
      Ingresando...
    } @else {
      <i class="ti ti-shield-lock"></i>
      Ingresar como Super Admin
    }
  </button>
</form>
