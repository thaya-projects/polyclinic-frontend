<div class="flex flex-col gap-4">
  <div class="flex justify-end">
    <button type="button" (click)="openCreate()"
      class="flex h-10 items-center justify-center gap-2 rounded-xl bg-brand px-4 text-sm font-medium whitespace-nowrap text-white transition-colors hover:bg-brand-dark">
      <i class="ti ti-plus"></i>
      Agregar contacto
    </button>
  </div>

  @if (listError()) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ listError() }}
    </div>
  }

  @if (listLoading()) {
    <div class="flex items-center justify-center gap-2 rounded-xl border border-border bg-surface py-10 text-sm text-muted">
      <i class="ti ti-loader-2 animate-spin"></i>
      Cargando contactos...
    </div>
  } @else {
    <app-contacts-table
      [contacts]="contacts()"
      (setPrimary)="onSetPrimary($event)"
      (edit)="onEdit($event)"
      (remove)="requestRemove($event)" />
  }
</div>

<app-modal [open]="creating()" title="Nuevo contacto" (closed)="closeCreate()">
  @if (saveError()) {
    <div class="mb-4 flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ saveError() }}
    </div>
  }
  @if (creating()) {
    <app-contact-form [saving]="saving()" (submitted)="onSave($event)" (cancelled)="closeCreate()" />
  }
</app-modal>

<app-modal [open]="editingContact() !== null" title="Editar contacto" (closed)="onCancelEdit()">
  @if (saveError()) {
    <div class="mb-4 flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ saveError() }}
    </div>
  }
  @if (editingContact(); as c) {
    <app-contact-form [contact]="c" [saving]="saving()" (submitted)="onSave($event)" (cancelled)="onCancelEdit()" />
  }
</app-modal>

<app-confirm-dialog
  [open]="contactToRemove() !== null"
  title="Eliminar contacto"
  [message]="removeMessage()"
  [confirmLabel]="removing() ? 'Eliminando...' : 'Eliminar'"
  tone="danger"
  (confirmed)="confirmRemove()"
  (cancelled)="cancelRemove()" />
