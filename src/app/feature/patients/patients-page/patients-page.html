<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-navy">Pacientes</h2>
      <p class="mt-1 text-sm text-muted">Listado de pacientes de la clínica.</p>
    </div>
    <button type="button" (click)="openCreateModal()"
      class="flex h-11 items-center justify-center gap-2 rounded-xl bg-brand px-5 text-sm font-medium whitespace-nowrap text-white transition-colors hover:bg-brand-dark">
      <i class="ti ti-plus"></i>
      Nuevo paciente
    </button>
  </div>

  @if (listError()) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ listError() }}
    </div>
  }

  <app-list-filters searchPlaceholder="Buscar por nombre o documento..." [(search)]="search" />

  @if (listLoading()) {
    <div class="flex items-center justify-center gap-2 rounded-xl border border-border bg-surface py-14 text-sm text-muted">
      <i class="ti ti-loader-2 animate-spin"></i>
      Cargando pacientes...
    </div>
  } @else {
    <app-patients-table [patients]="patients()" (view)="openDetail($event)" />

    <app-pagination [(page)]="page" [pageSize]="pageSize" [total]="total()" />
  }
</div>

<!-- Alta de paciente -->
<app-modal [open]="modalMode() === 'create'" title="Nuevo paciente" size="lg" (closed)="closeModal()">
  @if (actionError()) {
    <div class="mb-4 flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ actionError() }}
    </div>
  }
  <app-create-patient-form #patientForm (submitted)="onCreate($event)" />

  <div modalFooter class="flex items-center justify-end gap-3 border-t border-border px-6 py-4">
    <button type="button" (click)="closeModal()" [disabled]="saving()"
      class="flex h-10 items-center justify-center rounded-xl border border-border px-4 text-sm font-medium text-navy transition-colors hover:border-brand hover:text-brand disabled:opacity-50">
      Cancelar
    </button>
    <button type="button" (click)="patientForm.submit()" [disabled]="saving()"
      class="flex h-10 items-center justify-center rounded-xl bg-brand px-5 text-sm font-medium text-white transition-colors hover:bg-brand-dark disabled:opacity-60">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</app-modal>
