<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3 sm:flex-row sm:items-end sm:gap-2">
  <label class="flex flex-1 flex-col gap-1.5">
    <span class="text-xs font-medium text-muted">Estado</span>
    <select formControlName="status" [class]="inputClass(form.controls.status)">
      @for (status of statusOptions; track status) {
        <option [value]="status">{{ statusLabels[status] }}</option>
      }
    </select>
    @if (isInvalid(form.controls.status)) {
      <span class="text-xs text-red-500">{{ errorMessage(form.controls.status) }}</span>
    }
  </label>

  <label class="flex flex-1 flex-col gap-1.5">
    <span class="text-xs font-medium text-muted">Cita vinculada</span>
    <select formControlName="appointment_id" [class]="inputClass(form.controls.appointment_id)">
      <option value="">Sin vincular</option>
      @for (apt of appointments(); track apt.id) {
        <option [value]="apt.id">{{ apt.label }}</option>
      }
    </select>
    @if (isInvalid(form.controls.appointment_id)) {
      <span class="text-xs text-red-500">{{ errorMessage(form.controls.appointment_id) }}</span>
    }
  </label>

  <button type="submit" [disabled]="saving()"
    class="flex h-10 items-center justify-center rounded-xl border border-border px-4 text-xs font-medium text-navy transition-colors hover:border-brand hover:text-brand disabled:opacity-60">
    {{ saving() ? 'Guardando...' : 'Guardar' }}
  </button>
</form>

@if (item().status === 'completed') {
  <p class="mt-2 text-xs text-muted">
    Realizado el {{ formatDate(item().done_at) }}
    @if (item().done_by) { · por {{ item().done_by }} }
  </p>
}
