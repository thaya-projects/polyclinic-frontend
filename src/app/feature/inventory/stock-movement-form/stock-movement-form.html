<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Sucursal</span>
      <select formControlName="branch_id" [class]="inputClass(form.controls.branch_id)">
        <option value="" disabled>Elegí una sucursal</option>
        @for (branch of branches(); track branch.id) {
          <option [value]="branch.id">{{ branch.name }}</option>
        }
      </select>
      @if (isInvalid(form.controls.branch_id)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.branch_id) }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Material</span>
      <select formControlName="material_id" [class]="inputClass(form.controls.material_id)">
        <option value="" disabled>Elegí un material</option>
        @for (material of materials(); track material.id) {
          <option [value]="material.id">{{ material.code ? material.code + ' · ' : '' }}{{ material.name }}</option>
        }
      </select>
      @if (isInvalid(form.controls.material_id)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.material_id) }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Tipo</span>
      <select formControlName="type" [class]="inputClass(form.controls.type)">
        @for (type of types; track type) {
          <option [value]="type">{{ typeLabels[type] }}</option>
        }
      </select>
      @if (isInvalid(form.controls.type)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.type) }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Cantidad</span>
      <input type="number" step="0.01" formControlName="quantity" [class]="inputClass(form.controls.quantity)" />
      @if (isInvalid(form.controls.quantity)) {
        <span class="text-xs text-red-500">{{ quantityErrorMessage() }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Costo unitario (opcional)</span>
      <input type="number" min="0" step="0.01" formControlName="unit_cost" [class]="inputClass(form.controls.unit_cost)" />
      @if (isInvalid(form.controls.unit_cost)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.unit_cost) }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Moneda (opcional)</span>
      <select formControlName="currency" [class]="inputClass(form.controls.currency)">
        <option value="">Moneda de la clínica</option>
        @for (currency of currencies; track currency) {
          <option [value]="currency">{{ currency }}</option>
        }
      </select>
      @if (isInvalid(form.controls.currency)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.currency) }}</span>
      }
    </label>
  </div>

  <label class="flex flex-col gap-1.5">
    <span class="text-xs font-medium text-muted">Nota (opcional)</span>
    <textarea formControlName="note" rows="2" [class]="inputClass(form.controls.note)"></textarea>
    @if (isInvalid(form.controls.note)) {
      <span class="text-xs text-red-500">{{ errorMessage(form.controls.note) }}</span>
    }
  </label>
</form>
