<div class="flex flex-col gap-3">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h3 class="text-xs font-semibold tracking-wide text-muted uppercase">Producción</h3>
    <select [value]="professionalId()" (change)="onProfessionalChange($any($event.target).value)"
      class="rounded-lg border border-border bg-bg px-2.5 py-1.5 text-xs text-text focus:border-brand focus:outline-none">
      <option value="">Todos los profesionales</option>
      @for (p of professionals(); track p.id) {
        <option [value]="p.id">{{ p.full_name }}</option>
      }
    </select>
  </div>

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-xs text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ error() }}
    </div>
  } @else if (loading()) {
    <div class="flex items-center justify-center gap-2 rounded-xl border border-border bg-surface p-5 text-sm text-muted">
      <i class="ti ti-loader-2 animate-spin"></i>
      Cargando...
    </div>
  } @else if (report(); as r) {
    <app-stat-card label="Total producido" [value]="(r.total_amount.toFixed(2)) + ' ' + tenantCurrency" icon="chart-bar" />
    <p class="text-xs text-muted">
      Combina facturado y tratamientos completados sin separar por moneda; puede incluir montos de más de una moneda bajo este total.
    </p>
    <app-branch-amount-table [rows]="r.by_branch" [currency]="tenantCurrency" />
  }
</div>
