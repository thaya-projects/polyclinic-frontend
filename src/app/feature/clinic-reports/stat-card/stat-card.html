<div class="flex items-center gap-4 rounded-xl border border-border bg-surface p-5">
  <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-icon-soft">
    <i class="ti text-xl text-brand" [class]="'ti-' + icon()"></i>
  </div>
  <div class="flex flex-col">
    <span class="text-2xl font-bold text-navy">{{ value() }}</span>
    <span class="text-xs text-muted">{{ label() }}</span>
  </div>
</div>
