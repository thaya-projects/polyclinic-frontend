<div class="flex flex-wrap items-end gap-3 rounded-xl border border-border bg-surface p-4">
  <label class="flex flex-col gap-1">
    <span class="text-xs font-medium text-muted">Desde</span>
    <input type="date" [value]="from()" (change)="onFromChange($any($event.target).value)"
      class="rounded-xl border border-border bg-bg px-3 py-2 text-sm text-text focus:border-brand focus:ring-3 focus:ring-brand/18 focus:outline-none" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-xs font-medium text-muted">Hasta</span>
    <input type="date" [value]="to()" (change)="onToChange($any($event.target).value)"
      class="rounded-xl border border-border bg-bg px-3 py-2 text-sm text-text focus:border-brand focus:ring-3 focus:ring-brand/18 focus:outline-none" />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-xs font-medium text-muted">Entidad</span>
    <select [value]="entity()" (change)="onEntityChange($any($event.target).value)"
      class="rounded-xl border border-border bg-bg px-3 py-2 text-sm text-text focus:border-brand focus:ring-3 focus:ring-brand/18 focus:outline-none">
      <option value="">Todas</option>
      @for (e of entities(); track e) {
        <option [value]="e">{{ e }}</option>
      }
    </select>
  </label>
</div>
