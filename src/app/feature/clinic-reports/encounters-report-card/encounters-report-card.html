<div class="flex flex-col gap-2">
  <select [value]="professionalId()" (change)="onProfessionalChange($any($event.target).value)"
    class="self-end rounded-lg border border-border bg-bg px-2.5 py-1.5 text-xs text-text focus:border-brand focus:outline-none">
    <option value="">Todos los profesionales</option>
    @for (p of professionals(); track p.id) {
      <option [value]="p.id">{{ p.full_name }}</option>
    }
  </select>

  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-xs text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ error() }}
    </div>
  } @else if (loading()) {
    <div class="flex items-center justify-center gap-2 rounded-xl border border-border bg-surface p-5 text-sm text-muted">
      <i class="ti ti-loader-2 animate-spin"></i>
      Cargando...
    </div>
  } @else {
    <app-stat-card label="Encuentros firmados" [value]="report()?.total_count ?? 0" icon="file-check" />
  }
</div>
