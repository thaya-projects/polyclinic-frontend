<div class="flex flex-col gap-6">
  <form [formGroup]="form" (ngSubmit)="addToDraft()" class="flex flex-col gap-4 sm:flex-row sm:items-end">
    <label class="flex flex-1 flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Rol</span>
      <select formControlName="role_id" [class]="roleSelectClass()">
        <option value="" disabled>Seleccioná un rol</option>
        @for (role of roles(); track role.id) {
          <option [value]="role.id">{{ role.name }}</option>
        }
      </select>
      @if (isInvalid(form.controls.role_id)) {
        <span class="text-xs text-red-600">{{ errorMessage(form.controls.role_id) }}</span>
      } @else if (duplicateError()) {
        <span class="text-xs text-red-600">Ese rol con esa sucursal ya está agregado.</span>
      }
    </label>

    <label class="flex flex-1 flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Sucursal</span>
      <select formControlName="branch_id" [class]="inputClass(form.controls.branch_id)">
        <option value="">Todas las sucursales</option>
        @for (branch of branches(); track branch.id) {
          <option [value]="branch.id">{{ branch.name }}</option>
        }
      </select>
      @if (isInvalid(form.controls.branch_id)) {
        <span class="text-xs text-red-600">{{ errorMessage(form.controls.branch_id) }}</span>
      }
    </label>

    <button type="submit"
      class="flex h-11 items-center justify-center gap-2 rounded-xl bg-brand px-5 text-sm font-medium whitespace-nowrap text-white transition-colors hover:bg-brand-dark">
      <i class="ti ti-plus"></i>
      Agregar
    </button>
  </form>

  <app-user-role-assignments-table [rows]="rows()" [editable]="true" (remove)="removeFromDraft($event)" />
</div>
