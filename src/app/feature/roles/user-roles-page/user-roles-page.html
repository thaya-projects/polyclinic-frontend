<div class="flex flex-col gap-6">
  <div>
    <h2 class="text-2xl font-bold text-navy">Roles por usuario</h2>
    <p class="mt-1 text-sm text-muted">Roles y sucursales asignados a cada usuario de la clínica.</p>
  </div>

  <div class="flex flex-col gap-4 sm:flex-row">
    <label class="flex flex-1 flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Usuario (lista de ejemplo)</span>
      <select [value]="selectedUserId()" (change)="selectUser($any($event.target).value)"
        class="h-11 rounded-xl border border-border bg-surface px-3 text-sm text-text">
        @for (user of users(); track user.id) {
          <option [value]="user.id">{{ user.full_name }} — {{ user.email }}</option>
        }
      </select>
    </label>

    <label class="flex flex-1 flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">...o ID de usuario real</span>
      <input type="text" [value]="selectedUserId()" (change)="selectUser($any($event.target).value)"
        placeholder="ID de usuario del tenant autenticado"
        class="h-11 rounded-xl border border-border bg-surface px-3 font-mono text-sm text-text" />
    </label>
  </div>

  @if (listError()) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ listError() }}
    </div>
  }

  <div class="flex items-center justify-between gap-4">
    <h3 class="text-sm font-semibold text-navy">Roles asignados</h3>
    <button type="button" (click)="openModal()" [disabled]="!selectedUserId()"
      class="flex h-10 items-center justify-center gap-2 rounded-xl bg-brand px-4 text-sm font-medium whitespace-nowrap text-white transition-colors hover:bg-brand-dark disabled:opacity-50">
      <i class="ti ti-shield-cog"></i>
      Gestionar roles
    </button>
  </div>

  @if (listLoading()) {
    <div class="flex items-center justify-center gap-2 rounded-xl border border-border bg-surface py-14 text-sm text-muted">
      <i class="ti ti-loader-2 animate-spin"></i>
      Cargando roles del usuario...
    </div>
  } @else {
    <app-user-role-assignments-table [rows]="assignmentRows()" />
  }
</div>

<app-modal [open]="modalOpen()" title="Gestionar roles" size="lg" (closed)="closeModal()">
  @if (actionError()) {
    <div class="mb-4 flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
      <i class="ti ti-alert-circle"></i>
      {{ actionError() }}
    </div>
  }
  <app-assign-role-form #assignForm
    [roles]="roles()"
    [branches]="branches()"
    [initialAssignments]="initialAssignmentsForForm()"
    (saved)="onSave($event)" />

  <div modalFooter class="flex items-center justify-end gap-3 border-t border-border px-6 py-4">
    <button type="button" (click)="closeModal()" [disabled]="saving()"
      class="flex h-10 items-center justify-center rounded-xl border border-border px-4 text-sm font-medium text-navy transition-colors hover:border-brand hover:text-brand disabled:opacity-50">
      Cancelar
    </button>
    <button type="button" (click)="assignForm.submit()" [disabled]="saving()"
      class="flex h-10 items-center justify-center rounded-xl bg-brand px-5 text-sm font-medium text-white transition-colors hover:bg-brand-dark disabled:opacity-60">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
</app-modal>
