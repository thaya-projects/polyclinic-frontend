<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <label class="flex flex-col gap-1.5">
    <span class="text-xs font-medium text-muted">Nombre</span>
    <input type="text" formControlName="name" [class]="inputClass(form.controls.name)" />
    @if (isInvalid(form.controls.name)) {
      <span class="text-xs text-red-500">{{ errorMessage(form.controls.name) }}</span>
    }
  </label>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Categoría</span>
      <select formControlName="category_id" [class]="inputClass(form.controls.category_id)">
        <option value="">Sin categoría</option>
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
      @if (isInvalid(form.controls.category_id)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.category_id) }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Duración (minutos)</span>
      <input type="number" min="1" step="1" formControlName="duration_minutes" [class]="inputClass(form.controls.duration_minutes)" />
      @if (isInvalid(form.controls.duration_minutes)) {
        <span class="text-xs text-red-500">{{ durationErrorMessage() }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Precio base</span>
      <input type="number" min="0" step="0.01" formControlName="base_price" [class]="inputClass(form.controls.base_price)" />
      @if (isInvalid(form.controls.base_price)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.base_price) }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Moneda</span>
      <select formControlName="currency" [class]="inputClass(form.controls.currency)">
        <option value="" disabled>Seleccioná una moneda</option>
        @for (currency of currencies; track currency) {
          <option [value]="currency">{{ currency }}</option>
        }
      </select>
      @if (isInvalid(form.controls.currency)) {
        <span class="text-xs text-red-500">{{ errorMessage(form.controls.currency) }}</span>
      }
    </label>
  </div>
</form>
