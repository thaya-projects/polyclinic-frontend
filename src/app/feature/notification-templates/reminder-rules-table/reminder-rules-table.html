<app-data-table [columns]="columns" [rows]="rows()" emptyMessage="Todavía no hay reglas de recordatorio.">
  <ng-template appDataTableCell="event_type" let-row>
    <span class="font-semibold text-text">{{ eventTypeLabel(row.event_type) }}</span>
  </ng-template>

  <ng-template appDataTableCell="offset_minutes" let-row>
    {{ offsetLabel(row.offset_minutes) }}
  </ng-template>

  <ng-template appDataTableCell="channel" let-row>
    {{ channelLabel(row.channel) }}
  </ng-template>

  <ng-template appDataTableCell="template_name" let-row>
    <span class="text-muted">{{ row.template_name }}</span>
  </ng-template>

  <ng-template appDataTableCell="is_active" let-row>
    <app-status-chip [label]="row.is_active ? 'Activa' : 'Inactiva'" [tone]="row.is_active ? 'ok' : 'neutral'" />
  </ng-template>

  <ng-template appDataTableCell="actions" let-row>
    <div class="flex justify-end">
      <button type="button" (click)="view.emit(row)"
        class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-navy transition-colors hover:border-brand hover:text-brand">
        Editar
      </button>
    </div>
  </ng-template>
</app-data-table>
