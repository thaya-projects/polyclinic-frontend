<div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
  <app-list-filters
    searchPlaceholder="Buscar por número o texto del mensaje..."
    [filters]="filterConfigs()"
    [(search)]="search"
    [(values)]="values" />

  <div class="flex items-center gap-2">
    <label class="flex flex-col gap-1">
      <span class="text-xs font-medium text-muted">Desde</span>
      <input type="date" [value]="dateFrom()" (change)="onDateFromChange($any($event.target).value)"
        class="rounded-xl border border-border bg-surface px-3 py-2 text-sm text-text focus:border-brand focus:ring-3 focus:ring-brand/18 focus:outline-none" />
    </label>
    <label class="flex flex-col gap-1">
      <span class="text-xs font-medium text-muted">Hasta</span>
      <input type="date" [value]="dateTo()" (change)="onDateToChange($any($event.target).value)"
        class="rounded-xl border border-border bg-surface px-3 py-2 text-sm text-text focus:border-brand focus:ring-3 focus:ring-brand/18 focus:outline-none" />
    </label>
  </div>
</div>
