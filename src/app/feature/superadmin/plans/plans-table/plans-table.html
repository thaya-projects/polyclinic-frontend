<app-data-table [columns]="columns" [rows]="rows()" emptyMessage="No hay planes con esos filtros.">
  <ng-template appDataTableCell="code" let-row>
    <span class="font-mono text-xs text-muted">{{ row.code }}</span>
  </ng-template>

  <ng-template appDataTableCell="name" let-row>
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-icon-soft text-brand">
        <i class="ti ti-package"></i>
      </div>
      <span class="font-semibold text-text">{{ row.name }}</span>
    </div>
  </ng-template>

  <ng-template appDataTableCell="price" let-row>
    <span class="font-mono text-sm text-text">{{ formatPrice(row.price_month, row.currency) }}</span>
  </ng-template>

  <ng-template appDataTableCell="limits" let-row>
    <span class="text-sm text-muted">
      {{ formatLimit(row.max_professionals) }} / {{ formatLimit(row.max_branches) }}
    </span>
  </ng-template>

  <ng-template appDataTableCell="multi_specialty" let-row>
    <app-status-chip [label]="row.allow_multi_specialty ? 'Sí' : 'No'"
      [tone]="row.allow_multi_specialty ? 'ok' : 'neutral'" />
  </ng-template>

  <ng-template appDataTableCell="is_active" let-row>
    <button type="button" (click)="toggleActive.emit(row)"
      class="cursor-pointer rounded-full transition-transform hover:scale-105"
      [title]="row.is_active ? 'Click para desactivar' : 'Click para activar'">
      <app-status-chip [label]="row.is_active ? 'Activo' : 'Inactivo'"
        [tone]="row.is_active ? 'ok' : 'neutral'" />
    </button>
  </ng-template>

  <ng-template appDataTableCell="actions" let-row>
    <button type="button" (click)="edit.emit(row)"
      class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium text-navy transition-colors hover:border-brand hover:text-brand">
      Editar
    </button>
  </ng-template>
</app-data-table>
