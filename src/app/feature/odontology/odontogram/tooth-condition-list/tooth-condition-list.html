<div class="flex flex-col gap-2" data-testid="tooth-condition-list">
  <p class="text-xs font-semibold tracking-wide text-muted uppercase">Condiciones marcadas</p>
  @for (row of rows(); track row.item.id) {
    <div class="flex flex-col gap-1.5 rounded-lg border px-3 py-2"
      [class]="editingId() === row.item.id ? 'border-brand bg-card-accent' : 'border-border'"
      [attr.data-testid]="'tooth-condition-' + row.item.id">
      <div class="flex items-center gap-2">
        <span class="inline-block h-4 w-4 shrink-0 rounded border border-border" [style.background-color]="row.color"
          [attr.title]="row.color"></span>
        <span class="min-w-0 flex-1 truncate text-sm font-semibold text-text">{{ row.name }}</span>
        <app-status-chip [label]="row.state" [tone]="row.tone" />
      </div>
      <p class="text-xs text-muted">{{ row.surface }}</p>
      @if (row.item.note) {
        <p class="text-xs break-words text-text">{{ row.item.note }}</p>
      }
      @if (confirmingId() === row.item.id) {
        <div class="flex items-center justify-end gap-2">
          <span class="flex-1 text-xs text-red-600">¿Quitar esta condición?</span>
          <button type="button" (click)="cancelRemove()" data-testid="remove-cancel"
            class="rounded-lg border border-border px-2.5 py-1 text-xs font-medium text-navy hover:border-brand hover:text-brand">
            No
          </button>
          <button type="button" (click)="confirmRemove(row.item)" [disabled]="disabled()" data-testid="remove-confirm"
            class="rounded-lg bg-red-600 px-2.5 py-1 text-xs font-medium text-white hover:bg-red-700 disabled:opacity-60">
            Quitar
          </button>
        </div>
      } @else {
        <div class="flex items-center justify-end gap-2">
          <button type="button" (click)="edit.emit(row.item)" [disabled]="disabled()" data-testid="edit"
            class="rounded-lg border border-border px-2.5 py-1 text-xs font-medium text-navy transition-colors hover:border-brand hover:text-brand disabled:opacity-50">
            Editar
          </button>
          <button type="button" (click)="askRemove(row.item)" [disabled]="disabled()" data-testid="remove"
            class="rounded-lg border border-border px-2.5 py-1 text-xs font-medium text-red-600 transition-colors hover:border-red-400 disabled:opacity-50">
            Eliminar
          </button>
        </div>
      }
    </div>
  } @empty {
    <p class="text-xs text-muted" data-testid="tooth-condition-empty">Esta pieza no tiene condiciones marcadas.</p>
  }
</div>
