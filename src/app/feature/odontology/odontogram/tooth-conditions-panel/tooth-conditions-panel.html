<div class="flex flex-col gap-4" data-testid="tooth-conditions-panel">
  @if (error()) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-600" role="alert"
      data-testid="tooth-conditions-error">
      <i class="ti ti-alert-circle"></i>
      <span class="flex-1">{{ error() }}</span>
    </div>
  }

  <app-tooth-condition-list [items]="toothItems()" [catalog]="catalog()" [editingId]="editing()?.id ?? null"
    [disabled]="saving()" [readOnly]="readOnly()" (edit)="startEdit($event)" (remove)="remove($event)" />

  @if (readOnly()) {
    <p class="flex items-center gap-2 border-t border-border pt-3 text-xs text-muted" data-testid="tooth-conditions-readonly">
      <i class="ti ti-lock"></i>
      Odontograma histórico: solo lectura. Para marcar condiciones usá el odontograma actual.
    </p>
  } @else {
    <div class="border-t border-border pt-3">
      <app-tooth-condition-form [tooth]="tooth()" [dentition]="dentition()" [catalog]="catalog()"
        [presetSurface]="surface()" [item]="editing()" [saving]="saving()"
        (created)="create($event)" (saved)="save($event)" (cancelled)="cancelEdit()" />
    </div>
  }
</div>
