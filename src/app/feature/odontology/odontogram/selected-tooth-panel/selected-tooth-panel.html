<aside class="flex flex-col gap-3 rounded-xl border border-border bg-surface p-4" data-testid="selected-tooth-panel">
  @if (info(); as t) {
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-xs font-semibold tracking-wide text-muted uppercase">Pieza seleccionada</p>
        <p class="mt-1 text-2xl font-bold text-navy tabular-nums" data-testid="selected-tooth-number">{{ t.fdi }}</p>
        <p class="text-sm text-text">{{ t.name }}</p>
        <p class="text-xs text-muted">{{ t.quadrant }} · {{ t.temporary ? 'Temporal' : 'Permanente' }}</p>
      </div>
      <button type="button" (click)="cleared.emit()" aria-label="Quitar selección"
        class="rounded-lg p-1 text-muted transition-colors hover:bg-surface-alt hover:text-navy">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="border-t border-border pt-3">
      <ng-content select="[toothActions]">
        <p class="text-xs text-muted">Las condiciones de la pieza (caries, obturación, etc.) se marcarán desde acá.</p>
      </ng-content>
    </div>
  } @else {
    <div class="flex flex-col items-center gap-2 py-6 text-center text-sm text-muted">
      <i class="ti ti-hand-click text-2xl"></i>
      Seleccioná una pieza del odontograma para ver su detalle.
    </div>
  }
</aside>
