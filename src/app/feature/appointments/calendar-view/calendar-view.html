<div class="overflow-x-auto rounded-2xl border border-border bg-surface">
  <div class="flex min-w-[640px]">
    <!-- Columna de horas -->
    <div class="w-16 shrink-0 border-r border-border">
      <div class="h-10 border-b border-border"></div>
      @for (hour of hours; track hour) {
        <div class="flex items-start justify-end px-2 py-1 text-xs text-muted" [style.height.px]="rowHeightPx">
          {{ timeLabel(hour) }}
        </div>
      }
    </div>

    <!-- Columnas de días -->
    @for (day of days(); track day.getTime()) {
      <div class="relative flex-1 border-r border-border last:border-r-0">
        <div class="flex h-10 items-center justify-center border-b border-border text-xs font-semibold text-navy capitalize">
          {{ dayLabel(day) }}
        </div>
        <div class="relative" [style.height.px]="hours.length * rowHeightPx">
          @for (hour of hours; track hour) {
            <div class="absolute inset-x-0 border-b border-border" [style.top.px]="(hour - startHour) * rowHeightPx" [style.height.px]="rowHeightPx"></div>
          }
          @for (appt of appointmentsFor(day); track appt.id) {
            <button type="button" (click)="select.emit(appt)"
              class="absolute inset-x-1 overflow-hidden rounded-lg border border-brand/30 bg-icon-soft px-2 py-1 text-left text-xs text-brand transition-colors hover:border-brand"
              [style.top.px]="topFor(appt)" [style.height.px]="heightFor(appt)">
              <span class="block truncate font-semibold">{{ apptTimeRange(appt) }}</span>
              @if (appt.reason) {
                <span class="block truncate">{{ appt.reason }}</span>
              }
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
