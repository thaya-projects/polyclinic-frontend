<form [formGroup]="form" (ngSubmit)="add()" class="flex flex-col gap-4">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Monto</span>
      <input type="number" min="0" step="0.01" formControlName="amount" [class]="inputClass(form.controls.amount)" />
      @if (amountErrorMessage) {
        <span class="text-xs text-red-500">{{ amountErrorMessage }}</span>
      }
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Método</span>
      <select formControlName="method" [class]="inputClass(form.controls.method)">
        @for (m of methods; track m) {
          <option [value]="m">{{ methodLabels[m] }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Referencia (opcional)</span>
      <input type="text" formControlName="reference" placeholder="N° de operación, últimos dígitos, etc." [class]="inputClass(form.controls.reference)" />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-medium text-muted">Fecha de pago</span>
      <input type="date" formControlName="paid_at" [class]="inputClass(form.controls.paid_at)" />
    </label>
  </div>

  <div class="flex justify-end">
    <button type="submit"
      class="flex h-10 items-center justify-center rounded-xl bg-brand px-5 text-sm font-medium text-white transition-colors hover:bg-brand-dark">
      Registrar pago
    </button>
  </div>
</form>
