<div class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4 sm:items-end sm:px-6">
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex w-full max-w-sm items-start gap-2.5 rounded-xl border border-border bg-surface p-4 text-sm shadow-lg"
      [class]="toneClass(toast.tone)">
      <i class="ti mt-0.5 text-base" [class]="toneIcon(toast.tone)"></i>
      <p class="flex-1 leading-snug">{{ toast.message }}</p>
      <button type="button" (click)="dismiss(toast.id)" class="shrink-0 opacity-60 transition-opacity hover:opacity-100" aria-label="Cerrar notificación">
        <i class="ti ti-x"></i>
      </button>
    </div>
  }
</div>
