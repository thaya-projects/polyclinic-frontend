<app-modal [open]="open()" [title]="title()" size="sm" (closed)="cancelled.emit()">
  <p class="text-sm text-text">{{ message() }}</p>

  <div modalFooter class="flex items-center justify-end gap-3 border-t border-border px-6 py-4">
    <button type="button" (click)="cancelled.emit()"
      class="flex h-10 items-center justify-center rounded-xl border border-border px-4 text-sm font-medium text-navy transition-colors hover:border-brand hover:text-brand">
      {{ cancelLabel() }}
    </button>
    <button type="button" (click)="confirmed.emit()"
      class="flex h-10 items-center justify-center rounded-xl px-5 text-sm font-medium text-white transition-colors"
      [class]="tone() === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-brand hover:bg-brand-dark'">
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>
