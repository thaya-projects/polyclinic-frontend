@if (open()) {
  <div class="fixed inset-0 z-1000 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-navy/40" (click)="requestClose()"></div>

    <div class="relative flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-xl"
      [class]="sizeClass()" role="dialog" aria-modal="true">
      @if (title()) {
        <div class="flex items-center justify-between border-b border-border px-6 py-4">
          <h3 class="text-base font-semibold text-navy">{{ title() }}</h3>
          <button type="button" (click)="requestClose()" aria-label="Cerrar"
            class="flex h-8 w-8 items-center justify-center rounded-lg text-muted transition-colors hover:bg-icon-soft hover:text-text">
            <i class="ti ti-x"></i>
          </button>
        </div>
      }

      <div class="flex-1 overflow-y-auto px-6 py-5">
        <ng-content />
      </div>

      <ng-content select="[modalFooter]" />
    </div>
  </div>
}
